<style>
    @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap');

    body {
        font-family: 'Libre Baskerville', serif;
        margin: 0;
        padding: 0;
        padding-top: 78px;
        background-color: #fff;
        color: #000;
        position: relative;
        overflow-x: hidden;
    }

    .header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        box-sizing: border-box;
        z-index: 2000;

        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 20px;
        background-color: #fff;
        border-bottom: 1px solid #ddd;
    }

    .email {
        font-size: 1.35rem;
        font-weight: bold;
        color: #000;
        white-space: nowrap;
    }

    .email a {
        text-decoration: none;
        color: #000;
    }

    .email a:hover {
        text-decoration: underline;
        color: blue;
    }

    .menu {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-end;
        gap: 32px;
        margin: 0;
        padding: 0;
    }

    .menu a {
        display: inline-block;
        text-decoration: none;
        color: #000;
        font-size: 1.18rem;
        white-space: nowrap;
    }

    .menu a:hover {
        text-decoration: underline;
        color: blue;
    }

    .menu-icon {
        display: none;
    }

    .floating-instagram {
        position: absolute;
        left: 20px;
        top: 110px;
        font-size: 1.2rem;
        font-weight: bold;
        animation: moveDown 10s infinite linear;
    }

    .floating-instagram a {
        color: #000;
        text-decoration: none;
    }

    .floating-instagram a:hover {
        text-decoration: underline;
        color: blue;
    }

    @keyframes moveDown {
        0% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(300px);
        }
        100% {
            transform: translateY(0);
        }
    }

    @media (max-width: 768px) {
        body {
            padding-top: 125px;
        }

        .header {
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }

        .email {
            font-size: 1.2rem;
        }

        .menu {
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 12px 22px;
        }

        .menu a {
            font-size: 1rem;
        }

        .floating-instagram {
            top: 155px;
            font-size: 1.1rem;
        }
    }

.header { gap:24px; }
.menu { flex-wrap:wrap; gap:12px 24px; }
.floating-instagram { position:static; margin:34px 20px 50px; animation:none; }
.newsletter-invitation { max-width:600px; margin-top:36px; padding-top:24px; border-top:1px solid #ddd; }
.newsletter-invitation h2 { font-size:1.35rem; line-height:1.5; }
.newsletter-invitation p { font-size:1rem; font-weight:400; line-height:1.8; }
.newsletter-invitation a { text-decoration:underline; text-underline-offset:4px; }
a:focus-visible { outline:2px solid blue; outline-offset:4px; }
@media(max-width:1100px) { .header { flex-direction:column; align-items:flex-start; gap:14px; } .menu { justify-content:flex-start; } }

<script>
const header = document.querySelector('.header');
function updateHeaderHeight() { document.body.style.paddingTop = `${header.getBoundingClientRect().height}px`; }

window.addEventListener('resize', updateHeaderHeight);

if (document.fonts) document.fonts.ready.then(updateHeaderHeight);
