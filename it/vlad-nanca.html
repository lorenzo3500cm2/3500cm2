<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vlad Nanca</title>
  <style>
    body {
        font-family: 'Libre Baskerville', serif;
        margin: 0;
        padding: 0;
        padding-top: 76px;
        background-color: #000;
        color: #fff;
        position: relative;
        overflow-x: hidden;
    }

    .header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2000;

        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 18px 30px;
        background-color: #000;
        border-bottom: 1px solid #333;
        box-sizing: border-box;
    }

    .back-link {
        font-size: 1.5rem;
        font-weight: 700;
        text-decoration: none;
        color: #fff;
        white-space: nowrap;
    }

    .back-link:hover {
        color: blue;
    }

    .menu-icon {
        display: none;
    }

    .menu {
        display: flex;
        flex-direction: row;
        justify-content: flex-end;
        align-items: center;
        gap: 28px;

        position: static;
        padding: 0;
        margin: 0;
        background: transparent;
    }

    .menu a {
        display: inline-block;
        padding: 0;
        text-decoration: none;
        color: #fff;
        font-size: 1rem;
        white-space: nowrap;
    }

    .menu a:visited {
        color: #fff;
    }

    .menu a:hover {
        color: blue;
        text-decoration: underline;
    }

    img {
        width: 100%;
        max-height: 84vh;
        object-fit: contain;
        display: block;
        margin: 20px auto;
    }

    .description {
        font-family: 'Libre Baskerville', serif;
        font-size: 1rem;
        text-align: left;
        margin: 20px;
        color: #fff;
    }

    .prev-artist,
    .next-artist {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        font-size: 2rem;
        color: #aaa;
        text-decoration: none;
        z-index: 1000;
    }

    .prev-artist {
        left: 20px;
    }

    .next-artist {
        right: 20px;
    }

    .prev-artist:hover,
    .next-artist:hover {
        color: #fff;
    }

    @media screen and (max-width: 768px) {
        body {
            padding-top: 125px;
        }

        .header {
            flex-direction: column;
            align-items: flex-start;
            gap: 14px;
            padding: 16px 20px;
        }

        .back-link {
            font-size: 1.25rem;
            white-space: normal;
        }

        .menu {
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 10px 18px;
        }

        .menu a {
            font-size: 0.9rem;
        }

        img {
            max-height: 76vh;
            margin-top: 15px;
        }

        .prev-artist,
        .next-artist {
            font-size: 1.8rem;
        }

        .prev-artist {
            left: 12px;
        }

        .next-artist {
            right: 12px;
        }
    }
</style>
</head>
<body>
    <div class="header">
        <a href="pagina.html" class="back-link">Vlad Nanca</a>
        <div class="menu-icon" onclick="toggleMenu()">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    <!-- Menu nascosto -->
    <div class="menu" id="menu">
        <a href="pagina.html">Artisti</a>
        <a href="3500cm2.html">3500cm2</a>
        <a href="luoghi.html">Luoghi</a>
        <a href="contatti.html">Contatti</a>
    </div>

    <img src="vlad-nanca.jpg" alt="Vlad Nanca">

    <div class="description">
        #59 Vlad Nanca <i>No news is good news </i> 2006 Blueroom, Rialtosantambrogio, Roma
    </div>

    <!-- Frecce per navigare tra le pagine -->
    <a href="marc-nagtzaam.html" class="prev-artist">&#8592;</a>
    <a href="elena-nemkova.html" class="next-artist">&#8594;</a>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }
    </script>
</body>
</html>
