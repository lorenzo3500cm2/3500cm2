<!DOCTYPE html>

<head>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Libre Baskerville', serif;
            margin: 0;
            padding: 0;
            padding-top: 76px;
            background-color: #fff;
            color: #000;
            position: relative;
            overflow-x: hidden;
        }

        /* HEADER */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 3000;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 18px 30px;
            background-color: #fff;
            border-bottom: 1px solid #ddd;
            box-sizing: border-box;
        }

        /* NOME ARTISTA */
        .back-link {
            font-family: 'Libre Baskerville', serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
            color: #000;
            white-space: nowrap;
        }

        .back-link:visited {
            color: #000;
        }

        .back-link:hover {
            color: blue;
        }

        /* MENU */
        .menu {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
            gap: 28px;

            padding: 0;
            margin: 0;
        }

        .menu a {
            font-family: 'Libre Baskerville', serif;
            font-size: 1rem;
            font-weight: 400;
            text-decoration: none;
            color: #000;
            white-space: nowrap;
        }

        .menu a:visited {
            color: #000;
        }

        .menu a:hover {
            color: blue;
            text-decoration: underline;
        }

        /* IMMAGINE */
        img {
            width: 100%;
            max-height: 84vh;
            object-fit: contain;
            display: block;
            margin: 20px auto;
        }

        /* DIDASCALIA */
        .description {
            font-family: 'Libre Baskerville', serif;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            text-align: left;
            margin: 20px;
            color: #333;
        }

        /* FRECCE */
        .prev-artist,
        .next-artist {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            color: gray;
            text-decoration: none;
            z-index: 2000;
        }

        .prev-artist {
            left: 20px;
        }

        .next-artist {
            right: 20px;
        }

        .prev-artist:hover,
        .next-artist:hover {
            color: blue;
        }

        /* MOBILE */
        @media screen and (max-width: 768px) {

            body {
                padding-top: 125px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
                padding: 16px 20px;
            }

            .back-link {
                font-size: 1.25rem;
                white-space: normal;
            }

            .menu {
                width: 100%;
                flex-wrap: wrap;
                justify-content: flex-start;
                gap: 10px 18px;
            }

            .menu a {
                font-size: 0.9rem;
            }

            img {
                max-height: 76vh;
                margin-top: 15px;
            }

            .description {
                font-size: 0.9rem;
                margin: 20px;
            }

            .prev-artist,
            .next-artist {
                font-size: 1.8rem;
            }

            .prev-artist {
                left: 12px;
            }

            .next-artist {
                right: 12px;
            }
        }
    </style>

    <script src="../analytics.js"></script>
</head>

<body>

    <!-- HEADER -->
    <div class="header">

            <a href="partner.html">partner</a>
            <a href="contatti.html">contatti</a>
            <a href="../en/adelaide-cioni.html">EN</a>
        </nav>

    </div>

    <!-- IMMAGINE -->
    <img
        src="../img/adelaide-cioni.jpg"

    <!-- DIDASCALIA -->
    <div class="description">
        #113 Adelaide Cioni, <em>Miniature Works</em>, 2026<br>

    </div>

    >&#8594;</a>

    <!-- SWIPE MOBILE -->
    <script>
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        const previousPage = "diego-cibelli.html";
        const nextPage = "claire-fontaine.html";

        document.addEventListener("touchstart", function(event) {
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener("touchend", function(event) {
            touchEndX = event.changedTouches[0].screenX;
            touchEndY = event.changedTouches[0].screenY;

            handleSwipe();
        }, { passive: true });

        function handleSwipe() {

            const distanceX = touchEndX - touchStartX;
            const distanceY = touchEndY - touchStartY;

            const minimumSwipe = 70;

            /* Se il movimento è soprattutto verticale,
               lascia funzionare normalmente lo scroll */
            if (Math.abs(distanceY) > Math.abs(distanceX)) {
                return;
            }

            /* Ignora piccoli movimenti accidentali */
            if (Math.abs(distanceX) < minimumSwipe) {
                return;
            }

            /* Swipe verso destra = artista precedente */
            if (distanceX > 0) {
                window.location.href = previousPage;
            }

            /* Swipe verso sinistra = artista successivo */
            if (distanceX < 0) {
                window.location.href = nextPage;
            }
        }
    </script>

</body>
</html>
