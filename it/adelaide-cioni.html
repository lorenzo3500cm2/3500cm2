<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adelaide Cioni | 3500 cm²</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Libre Baskerville', serif;
            background-color: #fff;
            color: #000;
            padding-top: 76px;
            overflow-x: hidden;
        }

        /* HEADER */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 3000;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 18px 30px;

            background-color: #fff;
            border-bottom: 1px solid #ddd;
        }

        /* NOME ARTISTA */
        .back-link {
            font-family: 'Libre Baskerville', serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
            color: #000;
            white-space: nowrap;
        }

        .back-link:visited {
            color: #000;
        }

        .back-link:hover {
            color: blue;
        }

        /* MENU */
        .menu {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
            gap: 28px;

            margin: 0;
            padding: 0;
        }

        .menu a {
            font-family: 'Libre Baskerville', serif;
            font-size: 1rem;
            font-weight: 400;
            text-decoration: none;
            color: #000;
            white-space: nowrap;
        }

        .menu a:visited {
            color: #000;
        }

        .menu a:hover {
            color: blue;
            text-decoration: underline;
        }

        /* CONTENUTO */
        .artwork {
            width: 100%;
        }

        /* 
           Altezza calcolata per lasciare spazio
           alla didascalia nella stessa schermata.
        */
        .artwork img {
            width: 100%;
            height: calc(100vh - 190px);
            object-fit: contain;
            display: block;
            margin: 10px auto 0 auto;
        }

        /* DIDASCALIA */
        .description {
            font-family: 'Libre Baskerville', serif;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.4;

            text-align: left;
            margin: 10px 20px 20px 20px;

            color: #333;
        }

        /* FRECCE */
        .prev-artist,
        .next-artist {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);

            font-size: 2rem;
            color: gray;
            text-decoration: none;

            z-index: 2000;
        }

        .prev-artist {
            left: 20px;
        }

        .next-artist {
            right: 20px;
        }

        .prev-artist:hover,
        .next-artist:hover {
            color: blue;
        }

        /* MOBILE */
        @media screen and (max-width: 768px) {

            body {
                padding-top: 125px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;

                padding: 16px 20px;
            }

            .back-link {
                font-size: 1.25rem;
                white-space: normal;
            }

            .menu {
                width: 100%;
                flex-wrap: wrap;
                justify-content: flex-start;
                gap: 10px 18px;
            }

            .menu a {
                font-size: 0.9rem;
            }

            /*
               Anche su mobile lasciamo lo spazio
               necessario alla didascalia.
            */
            .artwork img {
                width: 100%;
                height: calc(100vh - 245px);
                max-height: none;
                object-fit: contain;
                margin: 10px auto 0 auto;
            }

            .description {
                font-size: 0.9rem;
                line-height: 1.4;
                margin: 8px 20px 15px 20px;
            }

            .prev-artist,
            .next-artist {
                font-size: 1.8rem;
            }

            .prev-artist {
                left: 12px;
            }

            .next-artist {
                right: 12px;
            }
        }

        /* TELEFONI MOLTO PICCOLI */
        @media screen and (max-width: 480px) {

            body {
                padding-top: 135px;
            }

            .header {
                padding: 14px 16px;
                gap: 12px;
            }

            .back-link {
                font-size: 1.15rem;
            }

            .menu {
                gap: 8px 13px;
            }

            .menu a {
                font-size: 0.82rem;
            }

            .artwork img {
                height: calc(100vh - 260px);
                margin-top: 8px;
            }

            .description {
                font-size: 0.85rem;
                line-height: 1.35;
                margin: 8px 16px 12px 16px;
            }
        }
    </style>

    <script src="../analytics.js"></script>
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <a href="pagina.html" class="back-link">
            #113 Adelaide Cioni
        </a>

        <nav class="menu">
            <a href="news.html">news</a>
            <a href="3500cm2.html">3500 cm²</a>
            <a href="pagina.html">artisti</a>
            <a href="luoghi.html">luoghi</a>
            <a href="mostre.html">mostre</a>
            <a href="partner.html">partner</a>
            <a href="contatti.html">contatti</a>
            <a href="../en/adelaide-cioni.html">EN</a>
        </nav>

    </header>

    <!-- OPERA -->
    <main class="artwork">

        <img
            src="../img/adelaide-cioni.jpg"
            alt="Adelaide Cioni, Miniature Works"
        >

        <div class="description">
            #113 Adelaide Cioni, <em>Miniature Works</em>, 2026<br>
            3500 cm², <em>Expositio Mundi</em>, Musei Civici di Palazzo Buonaccorsi,
            Biblioteca Comunale Mozzi Borgetti, Macerata
        </div>

    </main>

    <!-- FRECCE -->
    <a
        href="diego-cibelli.html"
        class="prev-artist"
        aria-label="Artista precedente"
    >&#8592;</a>

    <a
        href="claire-fontaine.html"
        class="next-artist"
        aria-label="Artista successivo"
    >&#8594;</a>

    <!-- SWIPE MOBILE -->
    <script>
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        const previousPage = "diego-cibelli.html";
        const nextPage = "claire-fontaine.html";

        document.addEventListener("touchstart", function(event) {
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener("touchend", function(event) {
            touchEndX = event.changedTouches[0].screenX;
            touchEndY = event.changedTouches[0].screenY;

            handleSwipe();
        }, { passive: true });

        function handleSwipe() {

            const distanceX = touchEndX - touchStartX;
            const distanceY = touchEndY - touchStartY;

            const minimumSwipe = 70;

            /* Non interferire con lo scroll verticale */
            if (Math.abs(distanceY) > Math.abs(distanceX)) {
                return;
            }

            /* Ignora movimenti troppo piccoli */
            if (Math.abs(distanceX) < minimumSwipe) {
                return;
            }

            /* Swipe verso destra = precedente */
            if (distanceX > 0) {
                window.location.href = previousPage;
            }

            /* Swipe verso sinistra = successivo */
            if (distanceX < 0) {
                window.location.href = nextPage;
            }
        }
    </script>

</body>
</html>
