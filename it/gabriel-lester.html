<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel Lester</title>

    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Libre Baskerville', serif;
        margin: 0;
        padding: 0;
        padding-top: 76px;
        background-color: #000;
        color: #fff;
        position: relative;
        overflow-x: hidden;
    }

    .header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2000;

        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 18px 30px;
        background-color: #000;
        border-bottom: 1px solid #333;
        box-sizing: border-box;
    }

    .back-link {
        font-family: 'Libre Baskerville', serif;
        font-size: 1.5rem;
        font-weight: 700;
        text-decoration: none;
        color: #fff;
        white-space: nowrap;
    }

    .back-link:visited {
        color: #fff;
    }

    .back-link:hover {
        color: blue;
    }

    /* MENU ORIZZONTALE */
    .menu {
        display: flex;
        flex-direction: row;
        justify-content: flex-end;
        align-items: center;
        gap: 28px;

        position: static;
        padding: 0;
        margin: 0;
        background: transparent;
    }

    .menu a {
        display: inline-block;
        padding: 0;
        text-decoration: none;
        color: #fff;
        font-size: 1rem;
        white-space: nowrap;
    }

    .menu a:visited {
        color: #fff;
    }

    .menu a:hover {
        color: blue;
        text-decoration: underline;
    }

    img {
        width: 100%;
        max-height: 84vh;
        object-fit: contain;
        display: block;
        margin: 20px auto;
    }

    .description {
        font-family: 'Libre Baskerville', serif;
        font-size: 1rem;
        line-height: 1.5;
        text-align: left;
        margin: 20px;
        color: #fff;
    }

    .prev-artist,
    .next-artist {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        font-size: 2rem;
        color: #aaa;
        text-decoration: none;
        z-index: 1000;
    }

    .prev-artist {
        left: 20px;
    }

    .next-artist {
        right: 20px;
    }

    .prev-artist:hover,
    .next-artist:hover {
        color: #fff;
    }

    /* MOBILE */
    @media screen and (max-width: 768px) {

        body {
            padding-top: 125px;
        }

        .header {
            flex-direction: column;
            align-items: flex-start;
            gap: 14px;
            padding: 16px 20px;
        }

        .back-link {
            font-size: 1.25rem;
            white-space: normal;
        }

        .menu {
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 10px 18px;
        }

        .menu a {
            font-size: 0.9rem;
        }

        img {
            max-height: 76vh;
            margin-top: 15px;
        }

        .description {
            font-size: 0.9rem;
        }

        .prev-artist,
        .next-artist {
            font-size: 1.8rem;
        }

        .prev-artist {
            left: 12px;
        }

        .next-artist {
            right: 12px;
        }
    }
</style>

    <script src="analytics.js"></script>
</head>

<body>

    <div class="header">
        <a href="pagina.html" class="back-link">#61 Gabriel Lester</a>

        <nav class="menu">
            <a href="pagina.html">artisti</a>
            <a href="3500cm2.html">3500cm2</a>
            <a href="luoghi.html">luoghi</a>
            <a href="contatti.html">contatti</a>
        </nav>
    </div>

    <img src="gabriel-lester.jpg" alt="Gabriel Lester">

    <div class="description">
        #61 Gabriel Lester, <em>High Noon</em>, 2006, Blueroom Rialtosantambrogio, Roma.
    </div>

    <!-- Frecce per navigare tra le pagine -->
    <a href="alon-levin.html" class="prev-artist">&#8592;</a>
    <a href="h-h-lim.html" class="next-artist">&#8594;</a>

    <!-- Swipe su dispositivi mobili -->
    <script>
        let touchStartX = 0;
        let touchEndX = 0;
        let touchStartY = 0;
        let touchEndY = 0;

        document.addEventListener('touchstart', function(event) {
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
        }, false);

        document.addEventListener('touchend', function(event) {
            touchEndX = event.changedTouches[0].screenX;
            touchEndY = event.changedTouches[0].screenY;
            handleSwipe();
        }, false);

        function handleSwipe() {
            const swipeDistanceX = touchEndX - touchStartX;
            const swipeDistanceY = touchEndY - touchStartY;
            const minSwipeDistance = 60;

            if (Math.abs(swipeDistanceX) < minSwipeDistance) return;

            if (Math.abs(swipeDistanceX) < Math.abs(swipeDistanceY)) return;

            if (swipeDistanceX > 0) {
                window.location.href = "alon-levin.html";
            } else {
                window.location.href = "h-h-lim.html";
            }
        }
    </script>

</body>
</html>
